name: CI

on:
  pull_request:
    branches:
      - main
  # merge_group:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  lint-check:
    if: endsWith(github.repository, '-private')
    strategy:
      fail-fast: false
      matrix:
        runs-on: 
          - ubuntu-24.04
        r-version:
          - '4.2.2'
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repositories
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install lintr
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: 'lintr@3.0.2'
          install-pandoc: false
          install-quarto: false

      - name: Run lint
        run: make check-lint

  format-check:
    if: endsWith(github.repository, '-private')
    strategy:
      fail-fast: false
      matrix:
        runs-on: 
          - ubuntu-24.04
        r-version:
          - '4.2.2'
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repositories
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install styler
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: 'styler@1.8.0'
          install-pandoc: false
          install-quarto: false

      - name: Enable styler cache
        run: styler::cache_activate()
        shell: Rscript {0}

      - name: Determine version and cache location
        id: styler-cache-keys
        run: |
          cat("location=",styler::cache_info(format = "tabular")$location,"\n",file = Sys.getenv("GITHUB_OUTPUT"),append = TRUE,sep = "")
          cat("styler-version=",as.character(utils::packageVersion("styler")),"\n",file = Sys.getenv("GITHUB_OUTPUT"),append = TRUE,sep = "")
        shell: Rscript {0}

      - name: Cache styler
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.styler-cache-keys.outputs.location }}
          key: ${{ matrix.runs-on }}-R-${{ matrix.r-version }}-styler-${{ steps.styler-cache-keys.outputs.styler-version }}-${{ github.event_name == 'merge_group' && 'main' || (github.head_ref || github.ref_name) }}
          restore-keys: |
            ${{ matrix.runs-on }}-R-${{ matrix.r-version }}-styler-${{ steps.styler-cache-keys.outputs.styler-version }}-
            ${{ matrix.runs-on }}-R-${{ matrix.r-version }}-styler-
            ${{ matrix.runs-on }}-R-${{ matrix.r-version }}-

      - name: Run format check
        shell: bash
        run: make check-format

  unit-test:
    if: endsWith(github.repository, '-private')
    strategy:
      fail-fast: false
      matrix:
        runs-on: 
          - ubuntu-24.04
        r-version:
          - '4.2.2'
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repositories
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        if: ${{ matrix.runs-on != 'self-hosted' }}
        env:
          RSPM: "https://packagemanager.posit.co/cran/__linux__/jammy/2022-10-27"
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            testthat@3.1.5
            pharmetheus/PMXForest
          install-pandoc: false
          install-quarto: false

      - name: Run unit tests
        shell: bash
        run: make test

  check-r-package:
    if: endsWith(github.repository, '-private')
    strategy:
      fail-fast: false
      matrix:
        runs-on: 
          - self-hosted
        r-version:
          - '4.2.2'
    runs-on: ${{ matrix.runs-on }}

    env:
      LIB_Q: /opt/R/packages/4.2/qualified
      REPO_UNQ: https://rpkgs.pmx.one/r4.2-unqualified/latest
      REPO_Q: https://rpkgs.pmx.one/r4.2-qualified/latest

    steps:
      - name: Add path for R and TexLive
        if: ${{ matrix.runs-on == 'self-hosted' }}
        run: |
          echo "/opt/R/${{ matrix.r-version }}/bin" >> $GITHUB_PATH
          echo "/opt/el8/texlive/2025/bin/x86_64-linux" >> $GITHUB_PATH

      - name: Checkout repositories
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ephemeral library
        if: ${{ matrix.runs-on == 'self-hosted' }}
        shell: bash
        run: |
          TEMP_LIB="$RUNNER_TEMP/Rlib-${GITHUB_RUN_ID}"
          mkdir -p "$TEMP_LIB"
          echo "R_LIBS_USER=$TEMP_LIB" >> $GITHUB_ENV

      - name: Install dependencies
        shell: Rscript --no-environ {0}
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          options(repos = c(
            unqualified = Sys.getenv("REPO_UNQ"),
            qualified   = Sys.getenv("REPO_Q")
          ))

          lib <- Sys.getenv("R_LIBS_USER")
          .libPaths(unique(c(lib, Sys.getenv("LIB_Q"), .libPaths())))

          if (!requireNamespace("remotes", quietly = TRUE)) {
            install.packages("remotes", lib = lib)
          }

          remotes::install_deps(
            dependencies = TRUE,
            lib = lib,
            upgrade = "never"
          )

          if (!requireNamespace("rcmdcheck", quietly = TRUE)) {
            install.packages("rcmdcheck", lib = lib)
          }

      - name: R CMD check
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          _R_CHECK_FORCE_SUGGESTS_: false
          _R_CHECK_CRAN_INCOMING_: false
        run: |
          export R_LIBS="${R_LIBS_USER}:${LIB_Q}:/opt/R/4.2.2/lib/R/library"

          Rscript --vanilla -e "
            options(crayon.enabled = TRUE)
            rcmdcheck::rcmdcheck(
              '.',
              args = c('--no-manual', '--as-cran', '--no-tests'),
              build_args = c('--no-manual'),
              error_on = 'warning'
            )
          "
